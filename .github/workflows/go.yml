name: hexfetch

on:
  push:
    branches:
      - tinygo
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Set up TinyGo
      uses: acifani/setup-tinygo@v2
      with:
        tinygo-version: '0.39.0'

    - name: Install dependencies
      run: sudo apt update && sudo apt install -y upx-ucl

    - name: Build
      run: |
        go mod init hexfetch
        tinygo build -o hexfetch-cli -opt=z -no-debug -gc=leaking main.go
        upx --best --lzma hexfetch-cli

    - name: Upload hexfetch as artifact
      uses: actions/upload-artifact@v4
      with:
        name: hexfetch-cli
        path: hexfetch-cli
    
    - name: Upload to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: hexfetch-cli
        draft: true
